name: ssrf
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: docker network scan
        run: |
          echo "=== DOCKER GATEWAY ==="
          curl -s --max-time 3 http://172.17.0.1/ 2>&1 | head -10
          curl -s --max-time 3 http://172.17.0.1:2375/ 2>&1 | head -10
          curl -s --max-time 3 http://172.17.0.1:2376/ 2>&1 | head -10
          
          echo "=== DOCKER API ==="
          curl -s --max-time 3 http://172.17.0.1:2375/version 2>&1 | head -10
          curl -s --max-time 3 http://172.17.0.1:2375/containers/json 2>&1 | head -10
          
          echo "=== DOCKER SUBNET SCAN ==="
          for i in 1 2 3 4 5; do
            result=$(curl -s --max-time 1 http://172.17.0.$i/ 2>&1 | head -2)
            echo "172.17.0.$i: $result"
          done
