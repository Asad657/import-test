name: ssrf
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: internal scan
        run: |
          echo "=== MY IP ==="
          hostname -I
          
          echo "=== SUBNET SCAN ==="
          for i in 1 2 3 4 5 10 100 200 254; do
            result=$(curl -s --max-time 1 http://10.1.0.$i/ 2>&1 | head -2)
            if [ ! -z "$result" ]; then
              echo "10.1.0.$i: $result"
            fi
          done
          
          echo "=== GITHUB INTERNAL SERVICES ==="
          curl -s --max-time 2 http://10.1.0.1/ 2>&1 | head -5
          curl -s --max-time 2 http://10.1.0.1:8080/ 2>&1 | head -5
          curl -s --max-time 2 http://10.1.0.1:443/ 2>&1 | head -5
          
          echo "=== DNS INTERNAL ==="
          nslookup github.internal || true
          nslookup api.github.internal || true
          nslookup actions.github.internal || true
