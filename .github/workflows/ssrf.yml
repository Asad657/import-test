name: ssrf
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: OIDC token
        run: |
          echo "ID URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "ID TOKEN: $ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | python3 -m json.tool)
          echo "OIDC: $TOKEN"
