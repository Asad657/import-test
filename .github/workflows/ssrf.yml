name: ssrf
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: full env dump
        run: |
          echo "=== FULL ENV ==="
          env | sort
          
          echo "=== PROC ENVIRON ==="
          cat /proc/1/environ | tr '\0' '\n' | sort
          
          echo "=== MOUNTED SECRETS ==="
          find /run/secrets/ 2>/dev/null || echo "none"
          find /var/run/secrets/ 2>/dev/null || echo "none"
          
          echo "=== HOSTS FILE ==="
          cat /etc/hosts
          
          echo "=== DNS CONFIG ==="
          cat /etc/resolv.conf
          
          echo "=== CREDENTIAL FILES ==="
          ls ~/.aws/ 2>/dev/null || echo "no aws"
          ls ~/.azure/ 2>/dev/null || echo "no azure"
          cat ~/.config/gh/hosts.yml 2>/dev/null || echo "no gh config"
